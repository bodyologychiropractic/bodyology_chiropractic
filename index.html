<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bodyology Chiropractic — Coming Soon</title>
  <meta name="description" content="Bodyology Chiropractic — our new website is on the way. Get in touch in the meantime.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f4f0; --surface:#ffffff; --ink:#1c2b2a; --muted:#5c6f6d;
      --accent:#2f6f62; --accent-soft:#e3efeb; --line:rgba(28,43,42,.10);
      --shadow:0 24px 60px -24px rgba(28,43,42,.28);
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#101615; --surface:#182120; --ink:#eef3f1; --muted:#a3b3af;
        --accent:#7fc9b5; --accent-soft:rgba(127,201,181,.14); --line:rgba(238,243,241,.12);
        --shadow:0 24px 60px -24px rgba(0,0,0,.6);
      }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      line-height:1.6; display:flex; align-items:center; justify-content:center; padding:24px;
      background-image:
        radial-gradient(900px 500px at 15% -10%, var(--accent-soft), transparent 60%),
        radial-gradient(700px 480px at 100% 110%, var(--accent-soft), transparent 65%);
    }
    .card{
      width:min(680px,100%); background:var(--surface); border:1px solid var(--line);
      border-radius:24px; box-shadow:var(--shadow); padding:clamp(28px,5vw,56px); text-align:center;
    }
    .badge{
      display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px;
      background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600;
      letter-spacing:.04em; text-transform:uppercase;
    }
    .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
    .brand{
      margin:26px 0 0; font-family:Fraunces,Georgia,serif; font-weight:600;
      font-size:clamp(30px,6vw,44px); letter-spacing:-.02em; line-height:1.15;
    }
    .rule{width:56px;height:2px;background:var(--accent);opacity:.55;margin:22px auto;border-radius:2px}
    h1{margin:0; font-size:clamp(19px,3.4vw,24px); font-weight:600; letter-spacing:-.01em}
    .lede{margin:14px auto 0; max-width:46ch; color:var(--muted)}
    .contact{
      margin-top:30px; padding-top:26px; border-top:1px solid var(--line);
      display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
    }
    .btn{
      display:inline-flex; align-items:center; gap:8px; text-decoration:none;
      padding:12px 22px; border-radius:999px; font-weight:600; font-size:15px;
      background:var(--accent); color:var(--surface); transition:transform .15s ease, opacity .15s ease;
    }
    .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
    .btn:hover{transform:translateY(-1px);opacity:.92}
    footer{margin-top:26px;font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge"><span class="dot"></span> Coming soon</span>
    <p class="brand">Bodyology Chiropractic</p>
    <div class="rule"></div>
    <h1>Our new website is on the way</h1>
    <p class="lede">We're putting the finishing touches on a better way to learn about our care and book your visit. Thanks for your patience.</p>

    <footer>&copy; <span id="y">2026</span> Bodyology Chiropractic</footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
