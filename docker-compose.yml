services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bodyology
      POSTGRES_PASSWORD: bodyology
      POSTGRES_DB: bodyology
    ports:
      - "5432:5432"
    volumes:
      - bodyology_postgres_data:/var/lib/postgresql/data

volumes:
  bodyology_postgres_data:
